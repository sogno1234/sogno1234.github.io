<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NORÐRÚNMARK character portrait accordion gallery." />
    <meta name="theme-color" content="#111111" />
    <title>NORÐRÚNMARK · Character Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      :root {
        color-scheme: dark;
        --palette-blue: #1e3fd8;
        --palette-white: #f6f8ff;
        --palette-light: #a5d8ff;
        --palette-cyan: #38bdf8;
        --background: var(--palette-blue);
        --foreground: var(--palette-white);
        --gold: var(--palette-cyan);
        --gold-soft: var(--palette-light);
        --line: rgba(255, 255, 255, 0.15);
        --serif: "Times New Roman", Times, serif;
        --section-space: clamp(48px, 6vw, 64px);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        position: relative;
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: #020406;
        color: var(--foreground);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      .ascii-background-layer {
        position: absolute;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: auto;
        min-height: 100%;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(ellipse 72% 58% at 18% -8%, rgba(76, 204, 180, 0.43), transparent 68%),
          radial-gradient(ellipse 70% 50% at 78% -5%, rgba(104, 168, 224, 0.41), transparent 66%),
          linear-gradient(
            180deg,
            #82cbd9 0%,
            #5b8eaa 24%,
            #24516f 50%,
            #0a1420 72%,
            #020406 100%
          );
      }

      .ascii-background-layer::before {
        position: absolute;
        z-index: 1;
        inset: -12% -6%;
        content: "";
        pointer-events: none;
        background:
          linear-gradient(112deg, transparent 18%, rgba(78, 221, 185, 0.19) 30%, transparent 43%),
          linear-gradient(98deg, transparent 54%, rgba(164, 214, 239, 0.16) 64%, transparent 76%);
        filter: blur(22px);
        mix-blend-mode: screen;
        -webkit-mask-image: linear-gradient(180deg, #000000 0%, #000000 55%, transparent 88%);
        mask-image: linear-gradient(180deg, #000000 0%, #000000 55%, transparent 88%);
      }

      .ascii-background-layer::after {
        position: absolute;
        z-index: 2;
        inset: 0;
        content: "";
        pointer-events: none;
        background:
          radial-gradient(ellipse at center, transparent 42%, rgba(0, 3, 6, 0.2) 100%),
          linear-gradient(180deg, transparent 54%, rgba(2, 4, 7, 0.45) 78%, #020406 100%);
      }

      .ascii-gradient-background {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        opacity: 0.78;
        filter: saturate(0.94) contrast(0.92) brightness(1.05);
        pointer-events: none;
        -webkit-mask-image: linear-gradient(180deg, #000000 0%, #000000 50%, rgba(0, 0, 0, 0.55) 78%, transparent 100%);
        mask-image: linear-gradient(180deg, #000000 0%, #000000 50%, rgba(0, 0, 0, 0.55) 78%, transparent 100%);
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        padding: 0;
        background: transparent;
      }

      .component {
        width: 100%;
        max-width: none;
        margin-inline: 0;
      }

      .editorial-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
      }

      .title-panel {
        padding: clamp(46px, 5vw, 78px) clamp(20px, 5vw, 76px) 42px;
        background: transparent;
        color: #e1efff;
      }

      .title-panel .masthead {
        margin-bottom: 0;
      }

      .title-panel .eyebrow {
        color: rgba(246, 248, 255, 0.76);
      }

      .title-panel h1 {
        position: relative;
        color: #07151f;
        background: none;
        -webkit-text-fill-color: currentColor;
        text-shadow: none;
        filter: none;
      }

      .content-panel {
        --active-flex: 6;
        --collapsed-portrait-half: 26px;
        --content-gutter: clamp(20px, 4vw, 56px);
        position: relative;
        width: 100%;
        min-width: 0;
        margin-inline: auto;
        padding: var(--section-space) var(--content-gutter) clamp(18px, 2vw, 28px);
        background: transparent;
        color: #ffffff;
        container-type: inline-size;
      }

      .gallery-section,
      .carousel-footer,
      .introduction-section,
      .footer {
        width: 100%;
        margin-inline: 0;
      }

      .gallery-section {
        padding-top: 0;
      }

      .masthead {
        width: 100%;
        max-width: 100%;
        margin: 0 0 32px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--gold-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.26em;
        line-height: 16px;
      }

      .eyebrow span {
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.5px;
        line-height: normal;
      }

      h1 {
        margin: 0;
        color: #ffffff;
        font-size: clamp(28px, 8.4vw, 96px);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.04;
        white-space: nowrap;
      }

      .gallery {
        display: flex;
        width: 100%;
        height: calc((100cqw - 24px) * 32 / 27);
        align-items: stretch;
        gap: 8px;
        outline: none;
      }

      .portrait {
        position: relative;
        min-width: 0;
        flex: 1 1 0;
        align-self: stretch;
        overflow: hidden;
        border-radius: 12px;
        background: transparent;
        box-shadow:
          0 10px 22px rgba(0, 3, 8, 0.16),
          0 2px 7px rgba(0, 3, 8, 0.09);
        text-align: left;
        cursor: pointer;
        isolation: isolate;
        transition: flex-grow 1000ms ease-in-out;
      }

      .portrait.is-active {
        flex-grow: 6;
      }

      .portrait:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      .portrait__image {
        position: absolute;
        top: 0;
        left: 50%;
        width: calc((100cqw - 24px) * 2 / 3);
        height: 100%;
        max-width: none;
        object-fit: cover;
        object-position: center;
        filter: brightness(0.62);
        transform: translateX(-50%);
        user-select: none;
        -webkit-user-drag: none;
        transition: filter 1000ms ease-in-out;
      }

      .portrait.is-active .portrait__image {
        filter: brightness(1);
      }

      .portrait:not(.is-active):hover .portrait__image {
        filter: brightness(0.9);
      }

      .portrait:not(.is-active)::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        content: "";
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.75),
          transparent 50%,
          rgba(0, 0, 0, 0.1)
        );
      }

      .portrait__index {
        position: absolute;
        z-index: 3;
        display: none;
        top: 20px;
        left: 50%;
        padding: 6px 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        color: #ffffff;
        font-size: 14px;
        line-height: 18px;
        transform: translateX(-50%);
        backdrop-filter: blur(12px);
        transition:
          border-color 300ms ease,
          color 300ms ease;
      }

      .portrait.is-active .portrait__index {
        border-color: rgba(255, 255, 255, 0.78);
        color: #ffffff;
      }

      .image-fallback {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: none;
        place-content: center;
        gap: 12px;
        padding: 16px;
        background: #0a2242;
        color: #ffffff;
        text-align: center;
      }

      .image-fallback svg {
        width: 80px;
        height: 112px;
        margin-inline: auto;
      }

      .image-fallback span {
        font-size: 13px;
        line-height: 1.5;
      }

      .portrait.image-error .portrait__image {
        display: none;
      }

      .portrait.image-error .image-fallback {
        display: grid;
      }

      .carousel-footer {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        gap: clamp(10px, 1.4vw, 18px);
        margin-top: 24px;
      }

      .carousel-controls {
        display: flex;
        min-width: 0;
        flex: 1 1 auto;
        align-items: center;
        gap: clamp(10px, 1.5vw, 20px);
      }

      .counter {
        color: #ffffff;
        font-size: clamp(14px, 1.1vw, 18px);
        line-height: 20px;
        white-space: nowrap;
      }

      .counter__total {
        margin-left: 5px;
        color: rgba(177, 195, 211, 0.72);
      }

      .dots {
        position: relative;
        display: flex;
        min-width: 0;
        flex: 1 1 auto;
        gap: 0;
        align-items: center;
        isolation: isolate;
      }

      .dots::before,
      .dots::after {
        position: absolute;
        top: calc(50% - 1.5px);
        left: 0;
        height: 3px;
        border-radius: 999px;
        content: "";
        pointer-events: none;
      }

      .dots::before {
        width: 100%;
        background: linear-gradient(
          90deg,
          rgba(128, 158, 188, 0.2),
          rgba(157, 188, 216, 0.42),
          rgba(128, 158, 188, 0.2)
        );
      }

      .dots::after {
        width: var(--carousel-progress, 25%);
        background: linear-gradient(
          90deg,
          rgba(190, 220, 246, 0.68),
          rgba(255, 255, 255, 0.98)
        );
        box-shadow: 0 0 10px rgba(198, 228, 255, 0.2);
        transition: width 560ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      .dot {
        position: relative;
        z-index: 1;
        display: flex;
        min-width: 0;
        min-height: 30px;
        flex: 1 1 0;
        align-items: center;
        justify-content: flex-end;
        border-radius: 4px;
        cursor: pointer;
      }

      .dot::before {
        width: 3px;
        height: 3px;
        content: "";
        border-radius: 50%;
        background: rgba(190, 211, 230, 0.56);
        transition:
          width 180ms ease,
          height 180ms ease,
          background 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dot[aria-current="true"]::before {
        width: 7px;
        height: 7px;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
      }

      .autoplay-toggle {
        display: grid;
        width: calc(var(--collapsed-portrait-half, 26px) * 2);
        height: calc(var(--collapsed-portrait-half, 26px) * 2);
        flex: 0 0 auto;
        margin-left: auto;
        place-items: center;
        border: 1px solid rgba(166, 192, 216, 0.52);
        border-radius: 999px;
        background: rgba(5, 20, 38, 0.2);
        color: #ffffff;
        cursor: pointer;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition:
          border-color 180ms ease,
          background-color 180ms ease,
          transform 180ms ease;
      }

      .autoplay-toggle:hover {
        border-color: rgba(225, 243, 255, 0.78);
        background: rgba(72, 133, 193, 0.2);
      }

      .autoplay-toggle:active {
        transform: scale(0.94);
      }

      .autoplay-toggle svg {
        width: clamp(10px, 4.2cqw, 16px);
        height: clamp(10px, 4.2cqw, 16px);
        fill: currentColor;
      }

      .autoplay-toggle__pause,
      .autoplay-toggle[aria-pressed="true"] .autoplay-toggle__play {
        display: none;
      }

      .autoplay-toggle[aria-pressed="true"] {
        border-color: rgba(216, 240, 255, 0.52);
        background: rgba(80, 157, 220, 0.24);
      }

      .autoplay-toggle[aria-pressed="true"] .autoplay-toggle__pause {
        display: block;
      }

      .panel-expand-toggle {
        display: none;
      }

      .content-frame {
        display: none;
      }

      .introduction-section {
        position: relative;
        isolation: isolate;
        margin-top: 0;
        padding: var(--section-space) 0;
        border-top: 0;
      }

      .introduction-card {
        position: relative;
        z-index: 1;
        min-width: 0;
        font-family: var(--serif);
        overflow: hidden;
        isolation: isolate;
        padding:
          clamp(46px, 5vw, 70px)
          clamp(36px, 4.5vw, 64px)
          clamp(46px, 5vw, 70px);
        border: 0;
        border-radius: 16px;
        background: rgba(4, 22, 44, 0.34);
        backdrop-filter: blur(62px) saturate(145%);
        -webkit-backdrop-filter: blur(62px) saturate(145%);
      }

      .introduction-scroll {
        position: relative;
        z-index: 1;
        min-height: 0;
      }

      .content-scroll {
        position: relative;
        z-index: 1;
        min-width: 0;
      }

      .introduction-scrollbar {
        position: absolute;
        z-index: 2;
        right: 15px;
        width: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.055);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .introduction-scrollbar.is-visible {
        opacity: 1;
      }

      .introduction-scrollbar__thumb {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        min-height: 28px;
        border: 0;
        border-radius: inherit;
        background: linear-gradient(
          180deg,
          rgba(229, 246, 255, 0.58),
          rgba(111, 178, 236, 0.42)
        );
      }

      .introduction-card::before,
      .introduction-card::after {
        position: absolute;
        inset: -10px;
        content: "";
        pointer-events: none;
      }

      .introduction-card::before {
        z-index: -1;
        inset: 0;
        display: block;
        background:
          linear-gradient(
              90deg,
              rgba(218, 239, 255, 0.07),
              rgba(218, 239, 255, 0.018) 34%,
              transparent 72%
            )
            left top / 100% 1px no-repeat,
          linear-gradient(
              180deg,
              rgba(218, 239, 255, 0.045),
              rgba(218, 239, 255, 0.008) 38%,
              transparent 68%
            )
            left top / 1px 100% no-repeat,
          radial-gradient(
            circle,
            rgba(226, 242, 255, 0.02) 0 0.4px,
            transparent 0.65px
          ) 0 0 / 4px 4px,
          linear-gradient(
            135deg,
            rgba(224, 243, 255, 0.035),
            rgba(224, 243, 255, 0.005) 28%,
            transparent 48%
          ),
          linear-gradient(
            315deg,
            rgba(88, 157, 213, 0.022),
            transparent 44%
          );
        background-blend-mode: soft-light, screen, screen;
        opacity: 0.72;
      }

      .introduction-card__veil {
        position: absolute;
        z-index: -2;
        inset: -14px;
        display: block;
        background: url("https://github.com/sogno1234/sogno55-2/blob/main/0_0%20(97).png?raw=true") center 58% / cover no-repeat;
        filter: blur(1.6px) saturate(0.9) brightness(0.92) contrast(1.28);
        transform: scale(1.065);
        opacity: 0.16;
        mix-blend-mode: normal;
        pointer-events: none;
        -webkit-mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.38) 0%,
          #000000 16%,
          #000000 88%,
          rgba(0, 0, 0, 0.42) 100%
        );
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.38) 0%,
          #000000 16%,
          #000000 88%,
          rgba(0, 0, 0, 0.42) 100%
        );
      }

      .introduction-card::after {
        z-index: -3;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 14% 0%,
            rgba(174, 216, 248, 0.03),
            transparent 48%
          ),
          radial-gradient(
            ellipse at 92% 102%,
            rgba(74, 145, 205, 0.025),
            transparent 44%
          ),
          linear-gradient(150deg, rgba(5, 25, 47, 0.56), rgba(0, 5, 14, 0.73));
      }

      .introduction-head {
        width: fit-content;
        max-width: 100%;
        padding-bottom: clamp(12px, 1.5vw, 16px);
        border-bottom: 0;
      }

      .introduction-label {
        margin: 0;
        color: #ffffff;
        font-size: 12px;
        letter-spacing: 0.18em;
        line-height: 16px;
      }

      .introduction-title {
        display: flex;
        width: fit-content;
        max-width: 100%;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.28em;
        margin: 0;
        transform: translateY(-6px);
        font-family: var(--serif);
        font-size: clamp(42px, 4.1vw, 54px);
        font-weight: 700;
        letter-spacing: 0.015em;
        line-height: 1.06;
        text-transform: uppercase;
      }

      .introduction-title .split-flap-text {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: clamp(2px, 0.55vw, 6px);
        color: inherit;
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
        user-select: none;
        font-variant-numeric: normal;
      }

      .split-flap-text__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .introduction-title .split-flap-text__tile {
        position: relative;
        flex: none;
        width: 0.78em;
        height: 1.08em;
        overflow: hidden;
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.14), transparent 44%),
          linear-gradient(180deg, #262d3b, #111827);
        box-shadow:
          0 0.035em 0.08em rgba(255, 255, 255, 0.07) inset,
          0 -0.05em 0.1em rgba(0, 0, 0, 0.38) inset,
          0 0.12em 0.28em rgba(0, 0, 0, 0.3);
        perspective: 10em;
        transform-style: preserve-3d;
        isolation: isolate;
      }

      .introduction-title .split-flap-text__tile::before {
        position: absolute;
        top: calc(50% - 0.5px);
        left: 0;
        z-index: 8;
        width: 100%;
        height: 1px;
        content: "";
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.16) 18%,
          rgba(0, 0, 0, 0.7) 50%,
          rgba(255, 255, 255, 0.12) 82%,
          transparent
        );
        box-shadow:
          0 -1px 0 rgba(255, 255, 255, 0.06),
          0 1px 0 rgba(0, 0, 0, 0.5);
      }

      .introduction-title .split-flap-text__tile::after {
        position: absolute;
        inset: 0;
        z-index: 9;
        content: "";
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.24) inset;
      }

      .introduction-title .split-flap-text__half,
      .introduction-title .split-flap-text__flap {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 34%),
          #111827;
        backface-visibility: hidden;
      }

      .introduction-title .split-flap-text__half--bottom,
      .introduction-title .split-flap-text__flap--back {
        background:
          linear-gradient(0deg, rgba(255, 255, 255, 0.055), transparent 38%),
          #0d1420;
      }

      .introduction-title .split-flap-text__half--top,
      .introduction-title .split-flap-text__flap--front {
        top: 0;
      }

      .introduction-title .split-flap-text__half--bottom,
      .introduction-title .split-flap-text__flap--back {
        bottom: 0;
      }

      .introduction-title .split-flap-text__char {
        position: absolute;
        left: 0;
        display: flex;
        width: 100%;
        height: 200%;
        align-items: center;
        justify-content: center;
        color: inherit;
        text-shadow:
          0 0.025em 0 rgba(255, 255, 255, 0.14),
          0 0.07em 0.12em rgba(0, 0, 0, 0.4);
      }

      .introduction-title .split-flap-text__half--top .split-flap-text__char,
      .introduction-title .split-flap-text__flap--front .split-flap-text__char {
        top: 0;
      }

      .introduction-title .split-flap-text__half--bottom .split-flap-text__char,
      .introduction-title .split-flap-text__flap--back .split-flap-text__char {
        bottom: 0;
      }

      .introduction-title .split-flap-text__flap {
        z-index: 6;
        will-change: transform, filter;
        transform-style: preserve-3d;
      }

      .introduction-title .split-flap-text__flap--front {
        transform-origin: center bottom;
        box-shadow: inset 0 0.02em 0 rgba(255, 255, 255, 0.12);
        animation: split-flap-front 0.12s linear both;
      }

      .introduction-title .split-flap-text__flap--back {
        transform-origin: center top;
        transform: rotateX(90deg);
        box-shadow: inset 0 -0.02em 0 rgba(0, 0, 0, 0.36);
        animation: split-flap-back 0.12s linear both;
      }

      @keyframes split-flap-front {
        0% {
          transform: rotateX(0deg);
          filter: brightness(1.04);
          animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19);
        }

        50%,
        100% {
          transform: rotateX(-90deg);
          filter: brightness(0.72);
        }
      }

      @keyframes split-flap-back {
        0%,
        50% {
          transform: rotateX(90deg);
          filter: brightness(0.72);
          animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
        }

                <button class="dot" type="button" data-dot="0" aria-label="View Ruarc" aria-current="true"></button>
                <button class="dot" type="button" data-dot="1" aria-label="View Liutpold" aria-current="false"></button>
                <button class="dot" type="button" data-dot="2" aria-label="View Vidran" aria-current="false"></button>
                <button class="dot" type="button" data-dot="3" aria-label="View Bennon" aria-current="false"></button>
              </div>
            </div>
            <button
              class="autoplay-toggle"
              id="autoplay-toggle"
              type="button"
              aria-label="Start automatic playback"
              aria-pressed="false"
              title="自动播放"
            >
              <svg class="autoplay-toggle__play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.4v13.2c0 .8.9 1.3 1.6.8l9.4-6.6c.6-.4.6-1.3 0-1.7L9.6 4.6C8.9 4.1 8 4.6 8 5.4Z" />
              </svg>
              <svg class="autoplay-toggle__pause" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
              </svg>
            </button>
          </div>

          <p class="sr-only" id="carousel-status" role="status" aria-live="polite">
            Ruarc selected. Character introduction updated below.
          </p>
        </section>

        <section
          class="introduction-section"
          id="character-introduction"
          aria-labelledby="character-title"
        >
          <div class="introduction-card">
            <span class="introduction-card__veil" aria-hidden="true"></span>
            <span class="introduction-scrollbar" aria-hidden="true">
              <span class="introduction-scrollbar__thumb"></span>
            </span>
            <div class="introduction-head">
              <h2 class="introduction-title" id="character-title" aria-label="Ruarc Morcant">
                <span id="character-name">Ruarc</span>
                <span class="introduction-surname" id="character-surname">Morcant</span>
              </h2>
            </div>
            <div class="introduction-scroll">
              <div class="introduction-body">
                <p class="introduction-copy" id="character-copy">
                  Ruarc’s introduction will be added here. His background, place in the world,
                  and story are yet to be revealed.
                </p>
                <p class="introduction-status">Content forthcoming</p>
              </div>
            </div>
          </div>
        </section>
        </div>

          </div>
        </div>
      </div>
    </main>

    <script>
      (() => {
        const portraits = [
          {
            name: "Ruarc",
            surname: "Morcant",
            copy:
              "Ruarc’s introduction will be added here. His background, place in the world, and story are yet to be revealed.",
          },
          {
            name: "Liutpold",
            surname: "von Afferstein",
            copy:
              "Liutpold’s introduction will be added here. His background, place in the world, and story are yet to be revealed.",
          },
          {
            name: "Vidran",
            surname: "von Lauken",
            copy:
              "Vidran’s introduction will be added here. His background, place in the world, and story are yet to be revealed.",
          },
          {
            name: "Bennon",
            surname: "von Lauken",
            copy:
              "Bennon’s introduction will be added here. His background, place in the world, and story are yet to be revealed.",
          },
        ];

        const gallery = document.querySelector("#gallery");
        const panels = [...document.querySelectorAll(".portrait")];
        const dots = [...document.querySelectorAll(".dot")];
        const dotsContainer = document.querySelector(".dots");
        const autoplayToggle = document.querySelector("#autoplay-toggle");
        const panelExpandToggle = document.querySelector("#panel-expand-toggle");
        const currentNumber = document.querySelector("#current-number");
        const title = document.querySelector("#character-title");
        const name = document.querySelector("#character-name");
        const surname = document.querySelector("#character-surname");
        const contentFrame = document.querySelector(".content-frame");
        const contentPanel = document.querySelector(".content-panel");
        const contentScroll = document.querySelector(".content-scroll");
        const introductionCard = document.querySelector(".introduction-card");
        const introductionScroll = document.querySelector(".introduction-scroll");
        const introductionScrollbar = document.querySelector(".introduction-scrollbar");
        const introductionScrollbarThumb = document.querySelector(
          ".introduction-scrollbar__thumb",
        );
        const copy = document.querySelector("#character-copy");
        const status = document.querySelector("#carousel-status");
        let current = 0;
        let touchStartX = null;
        let autoplayTimer = 0;
        let autoplayEnabled = false;
        let panelExpanded = false;
        let panelMotionTimer = 0;
        let resizeLockTimer = 0;
        const desktopLayout = window.matchMedia("(min-width: 960px)");

        function lockPanelToFirstCharacter() {
          contentPanel.classList.remove("is-height-locked");
          contentPanel.style.removeProperty("--locked-panel-height");
          contentFrame.style.removeProperty("--locked-frame-height");
          introductionCard.style.removeProperty("--locked-card-height");
          introductionScroll.scrollTop = 0;

          if (!desktopLayout.matches) return;

          requestAnimationFrame(() => {
            if (!desktopLayout.matches) return;
            const panelHeight = contentPanel.getBoundingClientRect().height;
            const cardHeight = introductionCard.getBoundingClientRect().height;
            if (!panelHeight || !cardHeight) return;

            contentPanel.style.setProperty("--locked-panel-height", `${panelHeight}px`);
            contentFrame.style.setProperty("--locked-frame-height", `${panelHeight - 8}px`);
            introductionCard.style.setProperty("--locked-card-height", `${cardHeight}px`);
            contentPanel.classList.add("is-height-locked");
            requestAnimationFrame(updateIntroductionScrollbar);
          });
        }

        function updateControlAxis() {
          if (panelExpanded) return;

          const galleryStyle = window.getComputedStyle(gallery);
          const gap = Number.parseFloat(galleryStyle.columnGap) || 0;
          const activeFlex =
            Number.parseFloat(
              window.getComputedStyle(contentPanel).getPropertyValue("--active-flex"),
            ) || 4.5;
          const collapsedWidth = (gallery.clientWidth - gap * 3) / (activeFlex + 3);
          if (collapsedWidth > 0) {
            contentPanel.style.setProperty("--collapsed-portrait-half", `${collapsedWidth / 2}px`);
          }
        }

        function updateExpandedScrollCue() {
          const maxScroll = contentScroll.scrollHeight - contentScroll.clientHeight;
          const canScroll = panelExpanded && maxScroll > 1;
          const scrollBox = contentScroll.getBoundingClientRect();
          const galleryBox = gallery.getBoundingClientRect();
          const clippedDistance = galleryBox.bottom - scrollBox.bottom;
          const fadeDistance = Math.max(48, scrollBox.height * 0.12);
          const visibility = Math.min(1, Math.max(0, clippedDistance / fadeDistance));
          contentPanel.classList.toggle("is-scrollable", canScroll);
          contentPanel.classList.toggle("is-cue-visible", canScroll && clippedDistance > 0.5);
          contentPanel.style.setProperty(
            "--scroll-cue-opacity",
            (0.62 * visibility).toFixed(3),
          );
        }

        function setPanelExpanded(expanded) {
          window.clearTimeout(panelMotionTimer);
          contentPanel.classList.remove("is-motion");
          void contentPanel.offsetWidth;
          contentPanel.classList.add("is-motion");
          panelExpanded = expanded;
          contentPanel.classList.toggle("is-expanded", expanded);
          contentFrame.classList.toggle("is-expanded", expanded);
          contentScroll.scrollTop = 0;
          panelExpandToggle.setAttribute("aria-expanded", String(expanded));
          panelExpandToggle.setAttribute(
            "aria-label",
            expanded
              ? "Restore gallery and character introduction size"
              : "Expand gallery and character introduction",
          );
          panelMotionTimer = window.setTimeout(() => {
            contentPanel.classList.remove("is-motion");
          }, 580);
          requestAnimationFrame(() => {
            requestAnimationFrame(updateExpandedScrollCue);
          });

          if (!expanded) {
            window.setTimeout(() => {
              updateControlAxis();
            }, 700);
          }
        }

        function pad(index) {
          return String(index + 1).padStart(2, "0");
        }

        function updateIntroductionScrollbar() {
          const maxScroll = introductionScroll.scrollHeight - introductionScroll.clientHeight;
          const canScroll = desktopLayout.matches && maxScroll > 1;
          introductionScrollbar.classList.toggle("is-visible", canScroll);
          if (!canScroll) return;

          const cardBox = introductionCard.getBoundingClientRect();
          const scrollBox = introductionScroll.getBoundingClientRect();
          const trackHeight = scrollBox.height;
          const thumbHeight = Math.min(
            trackHeight,
            Math.max(28, trackHeight * (introductionScroll.clientHeight / introductionScroll.scrollHeight)),
          );
          const travel = Math.max(0, trackHeight - thumbHeight);
          const offset = travel * (introductionScroll.scrollTop / maxScroll);

          introductionScrollbar.style.top = `${scrollBox.top - cardBox.top}px`;
          introductionScrollbar.style.height = `${trackHeight}px`;
          introductionScrollbarThumb.style.height = `${thumbHeight}px`;
          introductionScrollbarThumb.style.transform = `translateY(${offset}px)`;
        }

        function scheduleAutoplay() {
          window.clearTimeout(autoplayTimer);
          if (!autoplayEnabled) return;
          autoplayTimer = window.setTimeout(() => {
            selectPortrait(current + 1);
          }, 4200);
        }

        function setAutoplay(enabled) {
          autoplayEnabled = enabled;
          autoplayToggle.setAttribute("aria-pressed", String(enabled));
          autoplayToggle.setAttribute(
            "aria-label",
            enabled ? "Pause automatic playback" : "Start automatic playback",
          );
          window.clearTimeout(autoplayTimer);
          if (enabled) scheduleAutoplay();
        }

        function selectPortrait(index, focusPanel = false) {
          const nextIndex = (index + portraits.length) % portraits.length;
          current = nextIndex;
          const portrait = portraits[current];

          panels.forEach((panel, panelIndex) => {
            const isActive = panelIndex === current;
            panel.classList.toggle("is-active", isActive);
            panel.setAttribute("aria-pressed", String(isActive));
          });

          dots.forEach((dot, dotIndex) => {
            dot.setAttribute("aria-current", String(dotIndex === current));
          });

          currentNumber.textContent = pad(current);
          dotsContainer.style.setProperty(
            "--carousel-progress",
            `${((current + 1) / portraits.length) * 100}%`,
          );
          name.textContent = portrait.name;
          surname.textContent = portrait.surname;
          title.setAttribute("aria-label", `${portrait.name} ${portrait.surname}`);
          introductionScroll.scrollTop = 0;
          requestAnimationFrame(updateIntroductionScrollbar);
          requestAnimationFrame(updateExpandedScrollCue);
          copy.textContent = portrait.copy;
          status.textContent = `${portrait.name} selected. Character introduction updated below.`;

          if (focusPanel) {
            panels[current].focus({ preventScroll: true });
          }

          scheduleAutoplay();
        }

        panels.forEach((panel) => {
          panel.addEventListener("click", () => {
            selectPortrait(Number(panel.dataset.index));
          });

          const image = panel.querySelector(".portrait__image");
          image.addEventListener("error", () => panel.classList.add("image-error"));
          image.addEventListener("load", () => panel.classList.remove("image-error"));
          if (image.complete) {
            panel.classList.toggle("image-error", image.naturalWidth === 0);
          }
        });

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            updateControlAxis();
            lockPanelToFirstCharacter();
          });
        });

        dots.forEach((dot) => {
          dot.addEventListener("click", () => {
            selectPortrait(Number(dot.dataset.dot));
          });
        });

        autoplayToggle.addEventListener("click", () => {
          setAutoplay(!autoplayEnabled);
        });

        panelExpandToggle.addEventListener("click", () => {
          setPanelExpanded(!panelExpanded);
        });

        document.addEventListener("click", (event) => {
          if (!panelExpanded) return;
          const panelLeft = contentPanel.getBoundingClientRect().left;
          if (event.clientX < panelLeft) setPanelExpanded(false);
        });

        introductionScroll.addEventListener("scroll", updateIntroductionScrollbar, {
          passive: true,
        });
        contentScroll.addEventListener("scroll", updateExpandedScrollCue, {
          passive: true,
        });
        const galleryResizeObserver = new ResizeObserver(() => {
          requestAnimationFrame(updateControlAxis);
          requestAnimationFrame(updateExpandedScrollCue);
        });
        galleryResizeObserver.observe(gallery);
        window.addEventListener("resize", () => {
          if (!desktopLayout.matches && panelExpanded) setPanelExpanded(false);
          updateControlAxis();
          updateIntroductionScrollbar();
          updateExpandedScrollCue();
          window.clearTimeout(resizeLockTimer);
          resizeLockTimer = window.setTimeout(() => {
            if (!panelExpanded) lockPanelToFirstCharacter();
          }, 90);
        });

        gallery.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
          event.preventDefault();
          selectPortrait(current + (event.key === "ArrowRight" ? 1 : -1), true);
        });

        gallery.addEventListener(
          "touchstart",
          (event) => {
            touchStartX = event.touches[0].clientX;
          },
          { passive: true },
        );

        gallery.addEventListener(
          "touchend",
          (event) => {
            if (touchStartX === null) return;
            const difference = event.changedTouches[0].clientX - touchStartX;
            if (Math.abs(difference) > 45) {
              selectPortrait(current + (difference < 0 ? 1 : -1));
            }
            touchStartX = null;
          },
          { passive: true },
        );
      })();
    </script>
    <script src="./gradient-ascii.js"></script>
  </body>
</html>

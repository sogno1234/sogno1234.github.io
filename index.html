<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>角色档案 · 手风琴轮播</title>
  <link rel="preload" as="image" href="./assets/character-01.webp">
  <style>
    :root {
      --paper: #e9e7e0;
      --ink: #11110f;
      --stage: #090909;
      --white: #f5f1e8;
      --muted: rgba(245, 241, 232, .58);
      --line: rgba(245, 241, 232, .16);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -20%, rgba(255, 255, 255, .9), transparent 42rem),
        var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    button {
      font: inherit;
    }

    .page {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 100svh;
      gap: 18px;
      padding: clamp(16px, 2.4vw, 34px) clamp(16px, 3vw, 52px);
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand__mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      color: var(--paper);
      border-radius: 50%;
      background: var(--ink);
      font-family: Georgia, serif;
      font-size: 13px;
      font-style: italic;
      letter-spacing: 0;
    }

    .masthead__meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(17, 17, 15, .55);
    }

    .masthead__line {
      width: 42px;
      height: 1px;
      background: currentColor;
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 630px;
      padding: clamp(18px, 2vw, 30px);
      overflow: hidden;
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: clamp(20px, 2.2vw, 34px);
      background:
        radial-gradient(circle at 50% 60%, rgba(255, 255, 255, .035), transparent 45%),
        var(--stage);
      box-shadow: 0 30px 80px rgba(24, 23, 20, .18);
      isolation: isolate;
    }

    .stage::after {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      content: "";
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .stage__top {
      position: relative;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 34px;
      padding: 0 2px 15px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(245, 241, 232, .58);
    }

    .stage__status {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .stage__status::before {
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 50%;
      background: var(--active-accent, #b94e59);
      box-shadow: 0 0 15px var(--active-accent, #b94e59);
      transition: background .5s ease, box-shadow .5s ease;
    }

    .gallery {
      position: relative;
      z-index: 2;
      display: flex;
      min-width: 0;
      min-height: 0;
      gap: clamp(8px, 1vw, 14px);
      touch-action: pan-y;
    }

    .panel {
      --accent: #b94e59;
      --accent-rgb: 185, 78, 89;
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .14), transparent 35%),
        linear-gradient(165deg, rgba(var(--accent-rgb), .72), rgba(var(--accent-rgb), .18) 55%, #111 120%),
        #1b1b1b;
      cursor: pointer;
      text-align: left;
      transition:
        flex-grow .9s var(--ease),
        border-radius .9s var(--ease),
        background-color .5s ease,
        border-color .5s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .panel:nth-child(2) {
      --accent: #6e94b6;
      --accent-rgb: 110, 148, 182;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .14), transparent 35%),
        linear-gradient(165deg, rgba(var(--accent-rgb), .62), rgba(20, 36, 53, .5) 55%, #111 120%),
        #1b1b1b;
    }

    .panel:nth-child(3) {
      --accent: #b5c4cb;
      --accent-rgb: 181, 196, 203;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .14), transparent 35%),
        linear-gradient(165deg, rgba(var(--accent-rgb), .55), rgba(35, 49, 58, .5) 55%, #111 120%),
        #1b1b1b;
    }

    .panel:nth-child(4) {
      --accent: #93a8aa;
      --accent-rgb: 147, 168, 170;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .14), transparent 35%),
        linear-gradient(165deg, rgba(var(--accent-rgb), .55), rgba(26, 39, 42, .5) 55%, #111 120%),
        #1b1b1b;
    }

    .panel.is-active {
      flex-grow: 5;
      border-color: rgba(255, 255, 255, .18);
      border-radius: clamp(18px, 2vw, 30px);
      background: #0d0d0d;
      cursor: default;
    }

    .panel:focus-visible {
      z-index: 5;
      outline: 2px solid var(--accent);
      outline-offset: -6px;
    }

    .panel__media {
      position: absolute;
      inset: 0 42% 0 0;
      overflow: hidden;
      opacity: 0;
      transform: scale(1.07);
      transition:
        opacity .55s ease,
        transform 1.2s var(--ease);
    }

    .panel.is-active .panel__media {
      opacity: 1;
      transform: scale(1);
      transition-delay: .16s;
    }

    .panel__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 22%;
      filter: saturate(.97) contrast(1.03);
      user-select: none;
      -webkit-user-drag: none;
    }

    .panel__media::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        linear-gradient(90deg, transparent 58%, #0d0d0d 100%),
        linear-gradient(0deg, rgba(8, 8, 8, .44), transparent 38%),
        linear-gradient(180deg, rgba(8, 8, 8, .16), transparent 25%);
    }

    .panel__copy {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      width: 45%;
      padding: clamp(34px, 4vw, 70px) clamp(28px, 3.5vw, 58px);
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      opacity: 0;
      transform: translateX(26px);
      transition: opacity .45s ease, transform .75s var(--ease);
    }

    .panel.is-active .panel__copy {
      opacity: 1;
      transform: translateX(0);
      transition-delay: .26s;
    }

    .panel__eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: clamp(20px, 2.2vw, 34px);
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .panel__eyebrow::before {
      width: 24px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    .panel__title {
      margin: 0;
      font-family: "STSong", "Songti SC", "Noto Serif SC", Georgia, serif;
      font-size: clamp(42px, 5.2vw, 78px);
      font-weight: 500;
      line-height: .94;
      letter-spacing: -.07em;
    }

    .panel__title em {
      display: block;
      margin: .14em 0 0 .38em;
      color: var(--accent);
      font-weight: 400;
    }

    .panel__description {
      max-width: 320px;
      margin: clamp(24px, 2.8vw, 42px) 0 0;
      color: rgba(245, 241, 232, .68);
      font-size: clamp(12px, .92vw, 14px);
      line-height: 1.9;
      letter-spacing: .02em;
    }

    .panel__footer {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: clamp(26px, 3vw, 44px);
      padding-top: 14px;
      color: rgba(245, 241, 232, .5);
      border-top: 1px solid var(--line);
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .panel__footer b {
      color: var(--accent);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 9px;
      letter-spacing: .12em;
    }

    .panel__footer > span {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .panel__rail {
      position: absolute;
      inset: 0;
      display: flex;
      padding: 22px 0;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      opacity: 1;
      transition: opacity .22s ease;
    }

    .panel.is-active .panel__rail {
      opacity: 0;
      pointer-events: none;
      transition-delay: 0s;
    }

    .rail__number {
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: .08em;
      opacity: .58;
    }

    .rail__name {
      color: rgba(255, 255, 255, .9);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .rail__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 0 14px rgba(255, 255, 255, .25);
    }

    .controls {
      position: absolute;
      right: clamp(24px, 2.7vw, 38px);
      bottom: clamp(24px, 2.7vw, 38px);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 9px;
      opacity: 0;
      transform: translateY(8px) scale(.96);
      transition: opacity .35s ease .35s, transform .55s var(--ease) .25s;
    }

    .stage:hover .controls,
    .stage:focus-within .controls {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .control {
      display: grid;
      width: 40px;
      height: 40px;
      padding: 0;
      place-items: center;
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 50%;
      background: rgba(8, 8, 8, .62);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: color .25s ease, background .25s ease, transform .25s ease;
    }

    .control:hover,
    .control:focus-visible {
      color: #111;
      background: var(--white);
      outline: none;
      transform: translateY(-2px);
    }

    .control svg {
      width: 15px;
      height: 15px;
    }

    .control--pause {
      width: 32px;
      height: 32px;
      border-color: rgba(255, 255, 255, .12);
    }

    .controls__count {
      min-width: 56px;
      color: rgba(255, 255, 255, .58);
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: .12em;
      text-align: center;
    }

    .footnote {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 22px;
      color: rgba(17, 17, 15, .48);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .footnote__hint {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footnote__hint::before {
      width: 34px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (max-width: 760px) {
      body {
        background: var(--stage);
      }

      .page {
        display: block;
        min-height: 100svh;
        padding: 0;
      }

      .masthead,
      .footnote {
        display: none;
      }

      .stage {
        width: 100%;
        height: 100svh;
        min-height: 620px;
        padding: 15px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .stage__top {
        min-height: 47px;
        padding: 7px 5px 13px;
        font-size: 8px;
      }

      .stage__top .stage__date {
        display: none;
      }

      .gallery {
        flex-direction: column;
        gap: 8px;
        touch-action: pan-x;
      }

      .panel {
        border-radius: 999px;
        touch-action: pan-x;
        transition:
          flex-grow .9s var(--ease),
          border-radius .9s var(--ease),
          background-color .5s ease;
      }

      .panel.is-active {
        flex-grow: 7;
        border-radius: 22px;
      }

      .panel__media {
        inset: 0;
      }

      .panel__media img {
        object-position: 50% 17%;
      }

      .panel__media::after {
        background:
          linear-gradient(0deg, #0b0b0b 0%, rgba(11, 11, 11, .9) 18%, transparent 68%),
          linear-gradient(180deg, rgba(8, 8, 8, .18), transparent 25%);
      }

      .panel__copy {
        top: auto;
        left: 0;
        width: 100%;
        height: auto;
        min-height: 48%;
        padding: 24px 24px 22px;
        justify-content: flex-end;
        transform: translateY(18px);
      }

      .panel.is-active .panel__copy {
        transform: translateY(0);
      }

      .panel__eyebrow {
        margin-bottom: 12px;
      }

      .panel__title {
        font-size: clamp(40px, 12vw, 58px);
        line-height: .9;
      }

      .panel__title em {
        display: inline;
        margin: 0 0 0 10px;
      }

      .panel__description {
        max-width: 420px;
        margin-top: 13px;
        font-size: 11px;
        line-height: 1.7;
      }

      .panel__footer {
        margin-top: 14px;
        padding-top: 10px;
      }

      .panel__rail {
        padding: 0 20px;
        flex-direction: row;
      }

      .rail__name {
        writing-mode: horizontal-tb;
        transform: none;
      }

      .controls {
        top: 14px;
        right: 22px;
        bottom: auto;
        opacity: 1;
        transform: none;
      }

      .control:not(.control--pause) {
        display: none;
      }

      .control--pause {
        width: 30px;
        height: 30px;
        background: rgba(8, 8, 8, .72);
      }

      .controls__count {
        display: none;
      }
    }

    @media (max-height: 700px) and (max-width: 760px) {
      .stage {
        min-height: 560px;
      }

      .panel__description {
        display: none;
      }

      .panel__footer {
        margin-top: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">S</span>
        <span>SOGNO · CHARACTER ARCHIVE</span>
      </div>
      <div class="masthead__meta">
        <span>FOUR FIGURES</span>
        <span class="masthead__line" aria-hidden="true"></span>
        <span>2026</span>
      </div>
    </header>

    <section class="stage" aria-roledescription="手风琴轮播" aria-label="角色档案">
      <div class="stage__top">
        <span class="stage__status">Archive open</span>
        <span class="stage__date">Selected portraits / four chapters</span>
      </div>

      <div class="gallery">
        <button class="panel is-active" type="button" aria-expanded="true" aria-label="查看第 1 个角色：RUARC">
          <span class="panel__media" aria-hidden="true">
            <img src="./assets/character-01.webp" alt="" draggable="false">
          </span>
          <span class="panel__copy">
            <span class="panel__eyebrow">01 — Red oath</span>
            <span class="panel__title">绯红<em>誓约</em></span>
            <span class="panel__description">披上猩红斗篷，以骑士之名守住最后一道誓言。盔甲会锈蚀，而荣耀不会。</span>
            <span class="panel__footer">
              <b>RUARC · THE CRIMSON KNIGHT</b>
              <span>01 / 04</span>
            </span>
          </span>
          <span class="panel__rail" aria-hidden="true">
            <span class="rail__number">01</span>
            <span class="rail__name">RUARC</span>
            <span class="rail__dot"></span>
          </span>
        </button>

        <button class="panel" type="button" aria-expanded="false" aria-label="查看第 2 个角色：NOCTURNE">
          <span class="panel__media" aria-hidden="true">
            <img src="./assets/character-02.webp" alt="" draggable="false" loading="lazy">
          </span>
          <span class="panel__copy">
            <span class="panel__eyebrow">02 — Night letter</span>
            <span class="panel__title">夜航<em>书简</em></span>
            <span class="panel__description">灯火未眠，书页翻过一桩无人知晓的旧日密约。窗外的夜色，比文字更早抵达。</span>
            <span class="panel__footer">
              <b>NOCTURNE · THE LATE READER</b>
              <span>02 / 04</span>
            </span>
          </span>
          <span class="panel__rail" aria-hidden="true">
            <span class="rail__number">02</span>
            <span class="rail__name">NOCTURNE</span>
            <span class="rail__dot"></span>
          </span>
        </button>

        <button class="panel" type="button" aria-expanded="false" aria-label="查看第 3 个角色：FROSTBOUND">
          <span class="panel__media" aria-hidden="true">
            <img src="./assets/character-03.webp" alt="" draggable="false" loading="lazy">
          </span>
          <span class="panel__copy">
            <span class="panel__eyebrow">03 — Winter watch</span>
            <span class="panel__title">凛冬<em>守望</em></span>
            <span class="panel__description">风雪越过城墙，沉默的人仍站在时间最深处。他守的不是门，而是一段不能遗忘的过往。</span>
            <span class="panel__footer">
              <b>FROSTBOUND · THE LAST WARDEN</b>
              <span>03 / 04</span>
            </span>
          </span>
          <span class="panel__rail" aria-hidden="true">
            <span class="rail__number">03</span>
            <span class="rail__name">FROSTBOUND</span>
            <span class="rail__dot"></span>
          </span>
        </button>

        <button class="panel" type="button" aria-expanded="false" aria-label="查看第 4 个角色：SILVER VOW">
          <span class="panel__media" aria-hidden="true">
            <img src="./assets/character-04.webp" alt="" draggable="false" loading="lazy">
          </span>
          <span class="panel__copy">
            <span class="panel__eyebrow">04 — Silver vow</span>
            <span class="panel__title">银月<em>骑士</em></span>
            <span class="panel__description">银甲映着冷月，王城的故事在剑锋上重新开始。誓词很短，忠诚却要用一生写完。</span>
            <span class="panel__footer">
              <b>SILVER VOW · MOONLIT KNIGHT</b>
              <span>04 / 04</span>
            </span>
          </span>
          <span class="panel__rail" aria-hidden="true">
            <span class="rail__number">04</span>
            <span class="rail__name">SILVER VOW</span>
            <span class="rail__dot"></span>
          </span>
        </button>
      </div>

      <div class="controls">
        <button class="control control--pause" type="button" aria-label="暂停自动轮播" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M8 6v12M16 6v12"/>
          </svg>
        </button>
        <button class="control control--prev" type="button" aria-label="上一个角色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
          </svg>
        </button>
        <span class="controls__count" aria-hidden="true"><span>01</span> / 04</span>
        <button class="control control--next" type="button" aria-label="下一个角色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>

      <p id="announcement" class="sr-only" aria-live="polite">第 1 个角色，共 4 个：RUARC</p>
    </section>

    <footer class="footnote">
      <span>Portrait study · Sogno archive</span>
      <span class="footnote__hint">点击角色切换 · 左右键浏览</span>
    </footer>
  </main>

  <script>
    (() => {
      const stage = document.querySelector(".stage");
      const gallery = document.querySelector(".gallery");
      const panels = [...document.querySelectorAll(".panel")];
      const prevButton = document.querySelector(".control--prev");
      const nextButton = document.querySelector(".control--next");
      const pauseButton = document.querySelector(".control--pause");
      const count = document.querySelector(".controls__count span");
      const announcement = document.querySelector("#announcement");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const mobileQuery = window.matchMedia("(max-width: 760px)");

      const names = ["RUARC", "NOCTURNE", "FROSTBOUND", "SILVER VOW"];
      const AUTOPLAY_MS = 5200;

      let activeIndex = 0;
      let elapsed = 0;
      let lastTime = performance.now();
      let paused = reducedMotion.matches;
      let hovered = false;
      let focused = false;
      let dragStart = null;
      let suppressClick = false;

      function select(index, shouldAnnounce = true) {
        activeIndex = (index + panels.length) % panels.length;

        panels.forEach((panel, panelIndex) => {
          const active = panelIndex === activeIndex;
          panel.classList.toggle("is-active", active);
          panel.setAttribute("aria-expanded", String(active));
          panel.tabIndex = active ? -1 : 0;
          if (active) {
            stage.style.setProperty("--active-accent", getComputedStyle(panel).getPropertyValue("--accent").trim());
          }
        });

        const currentNumber = String(activeIndex + 1).padStart(2, "0");
        count.textContent = currentNumber;
        if (shouldAnnounce) {
          announcement.textContent = `第 ${activeIndex + 1} 个角色，共 ${panels.length} 个：${names[activeIndex]}`;
        }
        elapsed = 0;
      }

      function next() {
        select(activeIndex + 1);
      }

      function previous() {
        select(activeIndex - 1);
      }

      function updatePauseButton() {
        pauseButton.setAttribute("aria-pressed", String(paused));
        pauseButton.setAttribute("aria-label", paused ? "开始自动轮播" : "暂停自动轮播");
        pauseButton.innerHTML = paused
          ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.3v13.4L19 12 8 5.3Z"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg>';
      }

      function tick(now) {
        const delta = Math.min(now - lastTime, 80);
        lastTime = now;
        const canAdvance = !paused && !hovered && !focused && !document.hidden && dragStart === null;

        if (canAdvance) {
          elapsed += delta;
          if (elapsed >= AUTOPLAY_MS) next();
        }

        requestAnimationFrame(tick);
      }

      panels.forEach((panel, index) => {
        panel.addEventListener("click", () => {
          if (suppressClick) {
            suppressClick = false;
            return;
          }
          select(index);
        });
      });

      prevButton.addEventListener("click", previous);
      nextButton.addEventListener("click", next);

      pauseButton.addEventListener("click", () => {
        paused = !paused;
        elapsed = 0;
        updatePauseButton();
      });

      stage.addEventListener("mouseenter", () => {
        hovered = true;
      });

      stage.addEventListener("mouseleave", () => {
        hovered = false;
      });

      stage.addEventListener("focusin", () => {
        focused = true;
      });

      stage.addEventListener("focusout", (event) => {
        if (!stage.contains(event.relatedTarget)) focused = false;
      });

      stage.addEventListener("keydown", (event) => {
        const previousKey = mobileQuery.matches ? "ArrowUp" : "ArrowLeft";
        const nextKey = mobileQuery.matches ? "ArrowDown" : "ArrowRight";

        if (event.key === previousKey) {
          event.preventDefault();
          previous();
        }
        if (event.key === nextKey) {
          event.preventDefault();
          next();
        }
        if (event.key === "Home") {
          event.preventDefault();
          select(0);
        }
        if (event.key === "End") {
          event.preventDefault();
          select(panels.length - 1);
        }
      });

      gallery.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        dragStart = { x: event.clientX, y: event.clientY };
      });

      gallery.addEventListener("pointerup", (event) => {
        if (!dragStart) return;
        const deltaX = event.clientX - dragStart.x;
        const deltaY = event.clientY - dragStart.y;
        dragStart = null;

        const distance = mobileQuery.matches ? deltaY : deltaX;
        const crossDistance = mobileQuery.matches ? deltaX : deltaY;

        if (Math.abs(distance) > 46 && Math.abs(distance) > Math.abs(crossDistance) * 1.15) {
          suppressClick = true;
          distance < 0 ? next() : previous();
        }
      });

      gallery.addEventListener("pointercancel", () => {
        dragStart = null;
      });

      reducedMotion.addEventListener("change", (event) => {
        paused = event.matches;
        updatePauseButton();
      });

      document.addEventListener("visibilitychange", () => {
        lastTime = performance.now();
      });

      select(0, false);
      updatePauseButton();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>

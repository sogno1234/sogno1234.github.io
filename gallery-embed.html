<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NORÐRÚNMARK character portrait accordion gallery." />
    <meta name="theme-color" content="#111111" />
    <title>NORÐRÚNMARK · Character Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      :root {
        color-scheme: dark;
        --palette-blue: #1e3fd8;
        --palette-white: #f6f8ff;
        --palette-light: #a5d8ff;
        --palette-cyan: #38bdf8;
        --background: var(--palette-blue);
        --foreground: var(--palette-white);
        --gold: var(--palette-cyan);
        --gold-soft: var(--palette-light);
        --line: rgba(255, 255, 255, 0.15);
        --serif: "Times New Roman", Times, serif;
        --section-space: clamp(48px, 6vw, 64px);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        position: relative;
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: #07131f;
        color: var(--foreground);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      .ascii-background-layer {
        position: absolute;
        z-index: 0;
        inset: 0 0 auto;
        width: 100%;
        height: 600px;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(ellipse 72% 58% at 18% -8%, rgba(76, 204, 180, 0.43), transparent 68%),
          radial-gradient(ellipse 70% 50% at 78% -5%, rgba(104, 168, 224, 0.41), transparent 66%),
          linear-gradient(
            180deg,
            #82cbd9 0%,
            #5b8eaa 24%,
            #24516f 55%,
            #0c1a28 84%,
            #07131f 100%
          );
      }

      .ascii-background-layer::before {
        position: absolute;
        z-index: 1;
        inset: -12% -6%;
        content: "";
        pointer-events: none;
        background:
          linear-gradient(112deg, transparent 18%, rgba(78, 221, 185, 0.19) 30%, transparent 43%),
          linear-gradient(98deg, transparent 54%, rgba(164, 214, 239, 0.16) 64%, transparent 76%);
        filter: blur(22px);
        mix-blend-mode: screen;
      }

      .ascii-background-layer::after {
        position: absolute;
        z-index: 2;
        inset: 0;
        content: "";
        pointer-events: none;
        background:
          radial-gradient(ellipse at center, transparent 42%, rgba(0, 5, 10, 0.24) 100%),
          linear-gradient(180deg, transparent 58%, rgba(0, 0, 0, 0.2) 100%);
      }

      .ascii-gradient-background {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        opacity: 0.78;
        filter: saturate(0.94) contrast(0.92) brightness(1.05);
        pointer-events: none;
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        padding: 0;
        background: transparent;
      }

      .component {
        width: 100%;
        max-width: none;
        margin-inline: 0;
      }

      .editorial-layout {
        display: block;
        width: 100%;
        min-height: 100vh;
      }

      .title-panel {
        padding: clamp(46px, 5vw, 78px) clamp(20px, 5vw, 76px) 42px;
        background: transparent;
        color: #e1efff;
      }

      .title-panel .masthead {
        margin-bottom: 0;
      }

      .title-panel .eyebrow {
        color: rgba(246, 248, 255, 0.76);
      }

      .title-panel h1 {
        position: relative;
        color: #07151f;
        background: none;
        -webkit-text-fill-color: currentColor;
        text-shadow: none;
        filter: none;
      }

      .content-panel {
        --content-gutter: clamp(20px, 4vw, 56px);
        position: relative;
        width: 100%;
        min-width: 0;
        margin-inline: auto;
        padding: var(--section-space) var(--content-gutter) clamp(18px, 2vw, 28px);
        background: transparent;
        color: #ffffff;
        container-type: inline-size;
      }

      .gallery-section,
      .carousel-footer,
      .introduction-section,
      .footer {
        width: 100%;
        margin-inline: 0;
      }

      .gallery-section {
        padding-top: 0;
      }

      .masthead {
        width: 100%;
        max-width: 100%;
        margin: 0 0 32px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--gold-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.26em;
        line-height: 16px;
      }

      .eyebrow span {
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.5px;
        line-height: normal;
      }

      h1 {
        margin: 0;
        color: #ffffff;
        font-size: clamp(28px, 8.4vw, 96px);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.04;
        white-space: nowrap;
      }

      .gallery {
        display: flex;
        width: 100%;
        height: calc((100cqw - 24px) * 32 / 27);
        align-items: stretch;
        gap: 8px;
        outline: none;
      }

      .portrait {
        position: relative;
        min-width: 0;
        flex: 1 1 0;
        align-self: stretch;
        overflow: hidden;
        border-radius: 12px;
        background: transparent;
        text-align: left;
        cursor: pointer;
        isolation: isolate;
        transition: flex-grow 1000ms ease-in-out;
      }

      .portrait.is-active {
        flex-grow: 6;
      }

      .portrait:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      .portrait__image {
        position: absolute;
        top: 0;
        left: 50%;
        width: calc((100cqw - 24px) * 2 / 3);
        height: 100%;
        max-width: none;
        object-fit: cover;
        object-position: center;
        filter: brightness(0.62);
        transform: translateX(-50%);
        user-select: none;
        -webkit-user-drag: none;
        transition: filter 1000ms ease-in-out;
      }

      .portrait.is-active .portrait__image {
        filter: brightness(1);
      }

      .portrait:not(.is-active):hover .portrait__image {
        filter: brightness(0.9);
      }

      .portrait:not(.is-active)::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        content: "";
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.75),
          transparent 50%,
          rgba(0, 0, 0, 0.1)
        );
      }

      .portrait__index {
        position: absolute;
        z-index: 3;
        top: 20px;
        left: 50%;
        padding: 6px 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        color: #ffffff;
        font-size: 14px;
        line-height: 18px;
        transform: translateX(-50%);
        backdrop-filter: blur(12px);
        transition:
          border-color 300ms ease,
          color 300ms ease;
      }

      .portrait.is-active .portrait__index {
        border-color: rgba(255, 255, 255, 0.78);
        color: #ffffff;
      }

      .image-fallback {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: none;
        place-content: center;
        gap: 12px;
        padding: 16px;
        background: #0a2242;
        color: #ffffff;
        text-align: center;
      }

      .image-fallback svg {
        width: 80px;
        height: 112px;
        margin-inline: auto;
      }

      .image-fallback span {
        font-size: 13px;
        line-height: 1.5;
      }

      .portrait.image-error .portrait__image {
        display: none;
      }

      .portrait.image-error .image-fallback {
        display: grid;
      }

      .carousel-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
      }

      .carousel-controls {
        display: flex;
        align-items: center;
        gap: clamp(16px, 2vw, 24px);
      }

      .counter {
        color: #ffffff;
        font-size: 16px;
        line-height: 20px;
      }

      .counter__total {
        margin-left: 8px;
        color: #ffffff;
      }

      .dots {
        display: flex;
        gap: 4px;
      }

      .dot {
        display: flex;
        min-width: 28px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        cursor: pointer;
      }

      .dot::before {
        width: 16px;
        height: 2px;
        content: "";
        background: rgba(255, 255, 255, 0.34);
        transition:
          width 150ms cubic-bezier(0.4, 0, 0.2, 1),
          background 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dot[aria-current="true"]::before {
        width: 28px;
        background: #ffffff;
      }

      .introduction-section {
        position: relative;
        isolation: isolate;
        margin-top: 0;
        padding: var(--section-space) 0;
        border-top: 0;
      }

      .introduction-card {
        position: relative;
        z-index: 1;
        min-width: 0;
        font-family: var(--serif);
        overflow: hidden;
        isolation: isolate;
        padding:
          clamp(46px, 5vw, 70px)
          clamp(36px, 4.5vw, 64px)
          clamp(46px, 5vw, 70px);
        border: 0;
        border-radius: 16px;
        background: rgba(5, 31, 63, 0.34);
        backdrop-filter: blur(40px) saturate(152%);
        -webkit-backdrop-filter: blur(40px) saturate(152%);
      }

      .introduction-card::before,
      .introduction-card::after {
        position: absolute;
        inset: -10px;
        content: "";
        pointer-events: none;
      }

      .introduction-card::before {
        z-index: -3;
        background: url("https://github.com/sogno1234/sogno55-2/blob/main/0_0%20(97).png?raw=true") center 58% / cover no-repeat;
        filter: blur(1.5px) saturate(0.9) brightness(0.8);
        transform: scale(1.02);
      }

      .introduction-card__veil {
        position: absolute;
        z-index: -2;
        inset: -14px;
        display: block;
        background: url("https://github.com/sogno1234/sogno55-2/blob/main/0_0%20(97).png?raw=true") center 58% / cover no-repeat;
        filter: blur(12px) saturate(0.84) brightness(0.76);
        transform: scale(1.065);
        pointer-events: none;
        -webkit-mask-image: linear-gradient(
          180deg,
          #000000 0%,
          rgba(0, 0, 0, 0.9) 38%,
          transparent 92%
        );
        mask-image: linear-gradient(
          180deg,
          #000000 0%,
          rgba(0, 0, 0, 0.9) 38%,
          transparent 92%
        );
      }

      .introduction-card::after {
        z-index: -1;
        background: linear-gradient(180deg, rgba(5, 31, 63, 0.42), rgba(1, 11, 24, 0.62));
      }

      .introduction-head {
        width: fit-content;
        max-width: 100%;
        padding-bottom: clamp(12px, 1.5vw, 16px);
        border-bottom: 0;
      }

      .introduction-label {
        margin: 0;
        color: #ffffff;
        font-size: 12px;
        letter-spacing: 0.18em;
        line-height: 16px;
      }

      .introduction-title {
        display: flex;
        width: fit-content;
        max-width: 100%;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.28em;
        margin: 0;
        transform: translateY(-6px);
        font-family: var(--serif);
        font-size: clamp(42px, 4.1vw, 54px);
        font-weight: 700;
        letter-spacing: 0.015em;
        line-height: 1.06;
        text-transform: uppercase;
      }

      .introduction-title .split-flap-text {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: clamp(2px, 0.55vw, 6px);
        color: inherit;
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
        user-select: none;
        font-variant-numeric: normal;
      }

      .split-flap-text__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .introduction-title .split-flap-text__tile {
        position: relative;
        flex: none;
        width: 0.78em;
        height: 1.08em;
        overflow: hidden;
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.14), transparent 44%),
          linear-gradient(180deg, #262d3b, #111827);
        box-shadow:
          0 0.035em 0.08em rgba(255, 255, 255, 0.07) inset,
          0 -0.05em 0.1em rgba(0, 0, 0, 0.38) inset,
          0 0.12em 0.28em rgba(0, 0, 0, 0.3);
        perspective: 10em;
        transform-style: preserve-3d;
        isolation: isolate;
      }

      .introduction-title .split-flap-text__tile::before {
        position: absolute;
        top: calc(50% - 0.5px);
        left: 0;
        z-index: 8;
        width: 100%;
        height: 1px;
        content: "";
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.16) 18%,
          rgba(0, 0, 0, 0.7) 50%,
          rgba(255, 255, 255, 0.12) 82%,
          transparent
        );
        box-shadow:
          0 -1px 0 rgba(255, 255, 255, 0.06),
          0 1px 0 rgba(0, 0, 0, 0.5);
      }

      .introduction-title .split-flap-text__tile::after {
        position: absolute;
        inset: 0;
        z-index: 9;
        content: "";
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.24) inset;
      }

      .introduction-title .split-flap-text__half,
      .introduction-title .split-flap-text__flap {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 34%),
          #111827;
        backface-visibility: hidden;
      }

      .introduction-title .split-flap-text__half--bottom,
      .introduction-title .split-flap-text__flap--back {
        background:
          linear-gradient(0deg, rgba(255, 255, 255, 0.055), transparent 38%),
          #0d1420;
      }

      .introduction-title .split-flap-text__half--top,
      .introduction-title .split-flap-text__flap--front {
        top: 0;
      }

      .introduction-title .split-flap-text__half--bottom,
      .introduction-title .split-flap-text__flap--back {
        bottom: 0;
      }

      .introduction-title .split-flap-text__char {
        position: absolute;
        left: 0;
        display: flex;
        width: 100%;
        height: 200%;
        align-items: center;
        justify-content: center;
        color: inherit;
        text-shadow:
          0 0.025em 0 rgba(255, 255, 255, 0.14),
          0 0.07em 0.12em rgba(0, 0, 0, 0.4);
      }

      .introduction-title .split-flap-text__half--top .split-flap-text__char,
      .introduction-title .split-flap-text__flap--front .split-flap-text__char {
        top: 0;
      }

      .introduction-title .split-flap-text__half--bottom .split-flap-text__char,
      .introduction-title .split-flap-text__flap--back .split-flap-text__char {
        bottom: 0;
      }

      .introduction-title .split-flap-text__flap {
        z-index: 6;
        will-change: transform, filter;
        transform-style: preserve-3d;
      }

      .introduction-title .split-flap-text__flap--front {
        transform-origin: center bottom;
        box-shadow: inset 0 0.02em 0 rgba(255, 255, 255, 0.12);
        animation: split-flap-front 0.12s linear both;
      }

      .introduction-title .split-flap-text__flap--back {
        transform-origin: center top;
        transform: rotateX(90deg);
        box-shadow: inset 0 -0.02em 0 rgba(0, 0, 0, 0.36);
        animation: split-flap-back 0.12s linear both;
      }

      @keyframes split-flap-front {
        0% {
          transform: rotateX(0deg);
          filter: brightness(1.04);
          animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19);
        }

        50%,
        100% {
          transform: rotateX(-90deg);
          filter: brightness(0.72);
        }
      }

      @keyframes split-flap-back {
        0%,
        50% {
          transform: rotateX(90deg);
          filter: brightness(0.72);
          animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        100% {
          transform: rotateX(0deg);
          filter: brightness(1);
        }
      }

      @keyframes split-flap-reveal {
        0% {
          clip-path: inset(0 0 100% 0);
        }

        23.14% {
          clip-path: inset(0 0 99.21% 0);
        }

        29.67% {
          clip-path: inset(0 0 95.55% 0);
        }

        33.95% {
          clip-path: inset(0 0 89.09% 0);
        }

        37.41% {
          clip-path: inset(0 0 79.46% 0);
        }

        40.56% {
          clip-path: inset(0 0 66.05% 0);
        }

        43.73% {
          clip-path: inset(0 0 47.69% 0);
        }

        47.38% {
          clip-path: inset(0 0 21.22% 0);
        }

        50%,
        100% {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes split-flap-cover {
        0%,
        50% {
          clip-path: inset(0 0 0 0);
        }

        54.42% {
          clip-path: inset(35.75% 0 0 0);
        }

        57.44% {
          clip-path: inset(55.86% 0 0 0);
        }

        60.39% {
          clip-path: inset(70.63% 0 0 0);
        }

        63.65% {
          clip-path: inset(81.86% 0 0 0);
        }

        67.65% {
          clip-path: inset(90.23% 0 0 0);
        }

        73.17% {
          clip-path: inset(96% 0 0 0);
        }

        82.62% {
          clip-path: inset(99.25% 0 0 0);
        }

        100% {
          clip-path: inset(100% 0 0 0);
        }
      }

      .introduction-surname {
        color: inherit;
        font-family: var(--serif);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .introduction-body {
        min-width: 0;
        padding-top: clamp(24px, 3vw, 32px);
      }

      .introduction-about {
        margin: 0;
        color: #ffffff;
        font-size: 20px;
        font-weight: 400;
        line-height: 28px;
      }

      .introduction-copy {
        max-width: 768px;
        margin: 20px 0 0;
        color: #ffffff;
        font-size: 18px;
        line-height: 32px;
      }

      .introduction-status {
        margin: 32px 0 0;
        color: #ffffff;
        font-size: 14px;
        letter-spacing: 0.12em;
        line-height: 16px;
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 0;
        padding: 20px 0 32px;
        border-top: 1px solid var(--line);
        color: #ffffff;
        font-size: 14px;
        letter-spacing: 0.05em;
        line-height: 16px;
      }

      .footer__collection {
        letter-spacing: 0.18em;
      }

      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      @media (min-width: 800px) {
        .gallery {
          height: calc((100cqw - 48px) * 592 / 603);
          gap: 16px;
        }

        .portrait {
          border-radius: 16px;
        }

        .portrait.is-active {
          flex-grow: 3.7;
        }

        .portrait__image {
          width: calc((100cqw - 48px) * 37 / 67);
        }

        .portrait__index {
          top: 24px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="ascii-background-layer" aria-hidden="true">
      <canvas class="ascii-gradient-background" id="ascii-gradient-background"></canvas>
    </div>
    <main class="page" lang="en">
      <div class="component">
        <div class="editorial-layout">
          <div class="content-panel">
        <section class="gallery-section" aria-label="Character portrait accordion gallery" aria-roledescription="carousel">
          <div class="gallery" id="gallery">
            <button
              class="portrait is-active"
              type="button"
              data-index="0"
              aria-label="View Ruarc and character introduction"
              aria-pressed="true"
              aria-controls="character-introduction"
            >
              <img
                class="portrait__image"
                src="https://github.com/sogno1234/sogno55-2/blob/main/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20260926090707_916.png?raw=true"
                alt="Portrait of Ruarc"
                loading="eager"
                fetchpriority="high"
                draggable="false"
              />
              <span class="image-fallback" aria-hidden="true">
                <svg viewBox="0 0 100 140" fill="none">
                  <rect x="8" y="8" width="84" height="124" rx="8" stroke="currentColor" />
                  <circle cx="62" cy="42" r="10" stroke="currentColor" />
                  <path d="m8 105 30-38 25 25 16-18 13 19" stroke="currentColor" />
                </svg>
                <span>Image unavailable</span>
              </span>
              <span class="portrait__index">01</span>
            </button>

            <button
              class="portrait"
              type="button"
              data-index="1"
              aria-label="View Liutpold and character introduction"
              aria-pressed="false"
              aria-controls="character-introduction"

        let current = 0;
        let touchStartX = null;

        function pad(index) {
          return String(index + 1).padStart(2, "0");

        function selectPortrait(index, focusPanel = false) {
          const nextIndex = (index + portraits.length) % portraits.length;
          current = nextIndex;
          const portrait = portraits[current];

          panels.forEach((panel, panelIndex) => {
            const isActive = panelIndex === current;
            panel.classList.toggle("is-active", isActive);
            panel.setAttribute("aria-pressed", String(isActive));
          });

          dots.forEach((dot, dotIndex) => {
            dot.setAttribute("aria-current", String(dotIndex === current));
          });

          currentNumber.textContent = pad(current);
          name.textContent = portrait.name;
          surname.textContent = portrait.surname;
          title.setAttribute("aria-label", `${portrait.name} ${portrait.surname}`);
          about.textContent = `About ${portrait.name}`;
          copy.textContent = portrait.copy;
          status.textContent = `${portrait.name} selected. Character introduction updated below.`;

          if (focusPanel) {
            panels[current].focus({ preventScroll: true });
          }

          { passive: true },
        );

        gallery.addEventListener(

          (event) => {
            if (touchStartX === null) return;

            }
            touchStartX = null;
          },
          { passive: true },

    <script>
(() => {

out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);

  const COMMON = `
float hash12(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
`;

  const FIELD = `#version 300 es
precision highp float;
precision highp int;
uniform float uAspect;
uniform float uTime;
uniform int uShape;
uniform vec3 uRamp[8];
uniform int uCount;
uniform float uScale;
uniform float uSoftness;
uniform float uFlow;
uniform vec2 uSeed;
uniform vec4 uTrail[24];
uniform float uRadius;
uniform vec4 uClicks[4];
uniform int uClickEffect;
uniform float uIntro;
uniform float uFrame;
in vec2 vUv;
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAux;
${COMMON}
vec2 hash22(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.103, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.xx + q.yz) * q.zy) * 2.0 - 1.0;
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = dot(hash22(i), f);
  float b = dot(hash22(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash22(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash22(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
  return 0.5 + 0.5 * mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

vec3 labToRgb(vec3 lab) {
  float l = lab.x + 0.3963377774 * lab.y + 0.2158037573 * lab.z;
  float m = lab.x - 0.1055613458 * lab.y - 0.0638541728 * lab.z;
  float s = lab.x - 0.0894841775 * lab.y - 1.2914855480 * lab.z;
  l = l * l * l;
  m = m * m * m;
  s = s * s * s;
  return vec3(
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s

}

vec3 encode(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

vec3 horizon(vec2 p, float time, out float order) {
  float span = 0.5 * max(uAspect, 1.0);
  float x = p.x / span;
  float arch = -0.17 - 0.2 * x * x + 0.02 * sin(time * 0.6);
  float soft = mix(0.05, 0.22, uSoftness);
  float edge = p.y - arch;
  float rim = 0.38 * smoothstep(-soft, 0.42, edge);
  vec2 sun = vec2(0.08 * sin(time * 0.31) * span, 0.58);
  float spread = length((p - sun) / vec2(0.95 * span, 0.75));
  float sky = mix(0.55, 1.0, smoothstep(0.2, 0.95, spread));
  order = clamp(edge * 1.3, 0.0, 1.0);
  return vec3(rim, sky, smoothstep(0.18, 0.62, edge));
}

vec4 tone(float t) {
  float x = smoothstep(0.3, 1.0, t) * float(uCount - 1);
  int index = int(floor(x));
  return vec4(mix(uRamp[index], uRamp[min(index + 1, uCount - 1)], fract(x)), smoothstep(0.0, 0.38, t));
}

void main() {
  vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0);
  float time = uTime;
  vec2 q = p / uScale;
  vec2 warp = vec2(
    noise(q * 1.6 + uSeed + vec2(0.0, time * 0.3)),
    noise(q * 1.6 + uSeed.yx + vec2(4.3, -time * 0.24))
  ) - 0.5;
  q += warp * uFlow * 0.18;
  float order = 0.0;
  vec3 shape = horizon(q, time, order);

  float reveal = clamp((uIntro * 1.45 - order) / 0.45, 0.0, 1.0);
  reveal = reveal * reveal * (3.0 - 2.0 * reveal);

  float scramble = 0.0;
  for (int i = 0; i < 24; i++) {
    vec4 point = uTrail[i];
    if (point.z <= 0.0) continue;
    vec2 d = p - point.xy;
    scramble = max(scramble, point.z * exp(-dot(d, d) / (uRadius * uRadius)));
  }
  for (int i = 0; i < 4; i++) {
    vec4 c = uClicks[i];
    if (c.w <= 0.0) continue;
    float d = length(p - c.xy);
    scramble = max(scramble, exp(-pow((d - c.z * 0.75) / 0.06, 2.0)) * c.w);
  }

  vec2 t = clamp(shape.xy * mix(0.7, 1.0, reveal), 0.0, 1.0);
  vec4 mixed = mix(tone(t.x), tone(t.y), shape.z);
  vec3 color = encode(labToRgb(mixed.rgb));
  float alpha = mixed.a * reveal;
  float dither = (hash12(gl_FragCoord.xy + uFrame * 13.7) - 0.5) / 255.0;
  outColor = clamp(vec4(color * alpha + dither, alpha + dither), 0.0, 1.0);
  outAux = vec4(reveal, scramble, 0.0, 1.0);
}`;

  const GLYPHS = `
uniform sampler2D uField;
uniform sampler2D uAux;
uniform sampler2D uAtlas;
uniform vec2 uResolution;
uniform vec2 uCell;
uniform vec2 uOffset;
uniform vec2 uAtlasGrid;
uniform float uCount;
uniform float uDensity;
uniform float uOpacity;
uniform float uFlicker;
uniform float uDepth;
uniform float uGlyphTime;
uniform float uSeedValue;
uniform float uLight;
${COMMON}
float sampleGlyph(float index, vec2 local, vec2 coord, float soft) {
  float column = mod(index, uAtlasGrid.x);
  float row = floor(index / uAtlasGrid.x);
  vec2 atlasUv = vec2((column + local.x) / uAtlasGrid.x, (row + 1.0 - local.y) / uAtlasGrid.y);
  vec2 continuous = coord / uAtlasGrid;
  float scale = exp2(soft);
  return textureGrad(uAtlas, atlasUv, dFdx(continuous) * scale, dFdy(continuous) * scale).a;
}

vec4 glyphAt(vec2 px) {

  vec2 cell = floor(coord);
  vec2 local = coord - cell;
  vec2 uv = clamp(((cell + 0.5) * uCell + uOffset) / uResolution, vec2(0.0), vec2(1.0));
  vec4 field = texture(uField, uv);
  vec4 aux = texture(uAux, uv);
  vec3 visible = uLight > 0.5 ? field.rgb + (1.0 - field.a) : field.rgb;
  float luma = dot(visible, vec3(0.2126, 0.7152, 0.0722));
  float value = uLight > 0.5 ? clamp((1.0 - luma) * 1.5, 0.0, 1.0) : luma;
  float pick = hash12(cell + uSeedValue * 7.31);
  float level = hash12(cell * 1.73 + 4.1 + uSeedValue);
  float tick = floor(uGlyphTime * 9.0 + level * 9.0);
  float wobble = (hash12(cell * 2.31 + tick * 17.7) - 0.5) * uFlicker * 0.4 + (level - 0.5) * 0.1;
  float tone = clamp(pow(value, 0.75) + wobble, 0.0, 1.0);
  float index = floor(tone * (uCount - 1.0) + 0.5);
  float decode = max(aux.g, 1.0 - aux.r);

    if (hash12(cell * 3.7 + frame * 5.3) < decode * 1.25) index = 1.0 + floor(hash12(cell + frame * 1.37) * (uCount - 1.0));

  if (uCount >= 3.0) {
    float special = hash12(cell * 4.17 + floor(uGlyphTime * 2.2) * 9.73);
    if (special < 0.38) {
      index = hash12(cell * 8.23 + floor(uGlyphTime * 3.1) * 5.11) < 0.5 ? 1.0 : 2.0;
    }
  }
  float present = step(pick, uDensity * mix(1.0, 0.3 + tone * 1.1, 0.55));
  float cutoff = smoothstep(0.03, 0.1, value);
  float focus = step(hash12(cell * 0.71 + 9.2 + uSeedValue), uDepth);
  float coverage = sampleGlyph(index, local, coord, focus * 1.2);
  float alpha = uOpacity * present * cutoff * coverage * mix(1.0, 0.35 + 0.65 * level, 0.55) * (1.0 - focus * 0.5);
  if (uLight < 0.5) {
    vec3 light = field.rgb * 0.55 + vec3(0.03) * field.a;
    return vec4(light * alpha, 0.6 * field.a * alpha);
  }

  return vec4(ink * alpha, alpha);
}`;

  const HALO = `#version 300 es
precision highp float;
uniform float uDownscale;
in vec2 vUv;
out vec4 outColor;
${GLYPHS}
void main() {

  sum += texture(uSource, vUv + uStep * 3.2307692308) * 0.0702702703;
  sum += texture(uSource, vUv - uStep * 3.2307692308) * 0.0702702703;

precision highp float;
uniform sampler2D uHalo;
uniform float uGlow;
uniform float uGradient;
uniform float uGrain;
uniform float uFrame;
in vec2 vUv;
out vec4 outColor;
${GLYPHS}
void main() {
  vec4 base = texture(uField, vUv) * uGradient;
  vec4 glyph = glyphAt(gl_FragCoord.xy);
  vec4 halo = texture(uHalo, vUv) * uGlow;

  float grain = (hash12(gl_FragCoord.xy + uFrame * vec2(17.0, 59.0)) + hash12(gl_FragCoord.xy * 1.31 + uFrame * 7.0) - 1.0) * uGrain;

  color.a = clamp(color.a, 0.0, 1.0);
  color.rgb = clamp(color.rgb, 0.0, color.a);

  const compile = (type, source) => {
    const shader = gl.createShader(type);
    if (!shader) return null;
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  };

  const link = (fragmentSource) => {
    const vertex = compile(gl.VERTEX_SHADER, VERTEX);
    const fragment = compile(gl.FRAGMENT_SHADER, fragmentSource);
    const program = gl.createProgram();
    if (!vertex || !fragment || !program) return null;
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    gl.deleteShader(vertex);
    gl.deleteShader(fragment);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {

      gl.deleteProgram(program);

    const list = [...new Set([...settings.characters].filter((character) => character !== "\n" && character !== "\r"))];
    if (!list.length) list.push(" ");
    const columns = Math.min(ATLAS_COLUMNS, list.length);
    const rows = Math.ceil(list.length / columns);
    const atlasCanvas = document.createElement("canvas");
    atlasCanvas.width = ATLAS_CELL_W * columns;
    atlasCanvas.height = ATLAS_CELL_H * rows;
    const context = atlasCanvas.getContext("2d");
    if (context) {
      context.font = `300 ${Math.round(ATLAS_CELL_H * FONT_SCALE)}px ${settings.fontFamily}`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillStyle = "#ffffff";
      list.forEach((character, index) => {
        const column = index % columns;
        const row = Math.floor(index / columns);
        context.fillText(
          character,
          column * ATLAS_CELL_W + ATLAS_CELL_W / 2,
          row * ATLAS_CELL_H + ATLAS_CELL_H / 2 + 3,
        );
      });
    }
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, atlasCanvas);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return { texture, count: list.length, grid: [columns, rows] };
  };

  const toLinear = (value) => (value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
  const toLab = ([r, g, b]) => {
    const lr = toLinear(r);
    const lg = toLinear(g);
    const lb = toLinear(b);
    const l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb);
    const m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb);
    const s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb);
    return [
      0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
    ];
  };

  const parseColor = (hex) => {
    let value = hex.replace("#", "");
    if (value.length === 3) {
      value = value
        .split("")
        .map((character) => character + character)
        .join("");
    }
    const number = Number.parseInt(value, 16);
    return [((number >> 16) & 255) / 255, ((number >> 8) & 255) / 255, (number & 255) / 255];
  };

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const vao = gl.createVertexArray();
  const fieldTarget = createTarget(2);
  const haloA = createTarget(1);
  const haloB = createTarget(1);
  const ramp = new Float32Array(MAX_COLORS * 3);
  const clickData = new Float32Array(MAX_CLICKS * 4);
  const trailData = new Float32Array(MAX_TRAIL * 4);
  const clicks = [];
  const trail = [];
  const pointer = { x: 0, y: 0, inside: false };
  const view = { width: 1, height: 1, ratio: 1 };
  let atlas = null;
  let time = 0;
  let glyphTime = 0;
  let introClock = reducedMotion ? 1 : 0;
  let frameSeed = 0;
  let grainClock = 0;
  let raf = 0;
  let last = 0;
  let visible = true;

  settings.colors.forEach((color, index) => {
    ramp.set(toLab(parseColor(color)), index * 3);
  });

  const bindGlyphs = (program, width, height) => {
    if (!atlas) return;
    const uniforms = program.uniforms;
    const cellHeight = settings.cellSize * view.ratio;
    const cellWidth = cellHeight * (ATLAS_CELL_W / ATLAS_CELL_H);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fieldTarget.textures[0]);
    gl.uniform1i(uniforms.uField, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fieldTarget.textures[1]);
    gl.uniform1i(uniforms.uAux, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, atlas.texture);
    gl.uniform1i(uniforms.uAtlas, 2);
    gl.uniform2f(uniforms.uResolution, width, height);
    gl.uniform2f(uniforms.uCell, cellWidth, cellHeight);
    gl.uniform2f(
      uniforms.uOffset,
      (width - Math.ceil(width / cellWidth) * cellWidth) / 2,
      (height - Math.ceil(height / cellHeight) * cellHeight) / 2,
    );
    gl.uniform2f(uniforms.uAtlasGrid, atlas.grid[0], atlas.grid[1]);
    gl.uniform1f(uniforms.uCount, atlas.count);
    gl.uniform1f(uniforms.uDensity, settings.density);
    gl.uniform1f(uniforms.uOpacity, settings.glyphOpacity);
    gl.uniform1f(uniforms.uFlicker, reducedMotion ? 0 : settings.flicker);
    gl.uniform1f(uniforms.uDepth, settings.depthOfField);
    gl.uniform1f(uniforms.uGlyphTime, glyphTime);
    gl.uniform1f(uniforms.uSeedValue, settings.variation);
    gl.uniform1f(uniforms.uLight, 0);
  };

  const draw = () => {
    const aspect = view.width / view.height;
    gl.bindVertexArray(vao);
    gl.disable(gl.BLEND);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fieldTarget.framebuffer);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.viewport(0, 0, fieldTarget.width, fieldTarget.height);
    gl.useProgram(fieldProgram.program);
    gl.uniform1f(fieldProgram.uniforms.uAspect, aspect);
    gl.uniform1f(fieldProgram.uniforms.uTime, time);
    gl.uniform1i(fieldProgram.uniforms.uShape, 0);
    gl.uniform3fv(fieldProgram.uniforms.uRamp, ramp);
    gl.uniform1i(fieldProgram.uniforms.uCount, settings.colors.length);
    gl.uniform1f(fieldProgram.uniforms.uScale, settings.scale);
    gl.uniform1f(fieldProgram.uniforms.uSoftness, settings.softness);
    gl.uniform1f(fieldProgram.uniforms.uFlow, settings.flow);
    gl.uniform2f(fieldProgram.uniforms.uSeed, 0, 0);
    gl.uniform4fv(fieldProgram.uniforms.uTrail, trailData);
    gl.uniform1f(fieldProgram.uniforms.uRadius, settings.scrambleRadius);
    gl.uniform4fv(fieldProgram.uniforms.uClicks, clickData);
    gl.uniform1i(fieldProgram.uniforms.uClickEffect, 1);
    gl.uniform1f(fieldProgram.uniforms.uIntro, introClock);
    gl.uniform1f(fieldProgram.uniforms.uFrame, frameSeed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, haloA.framebuffer);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
    gl.viewport(0, 0, haloA.width, haloA.height);
    gl.useProgram(haloProgram.program);
    bindGlyphs(haloProgram, canvas.width, canvas.height);
    gl.uniform1f(haloProgram.uniforms.uDownscale, canvas.width / haloA.width);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(blurProgram.program);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(blurProgram.uniforms.uSource, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, haloB.framebuffer);
    gl.bindTexture(gl.TEXTURE_2D, haloA.textures[0]);
    gl.uniform2f(blurProgram.uniforms.uStep, 1 / haloA.width, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, haloA.framebuffer);
    gl.bindTexture(gl.TEXTURE_2D, haloB.textures[0]);
    gl.uniform2f(blurProgram.uniforms.uStep, 0, 1 / haloA.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(compositeProgram.program);
    bindGlyphs(compositeProgram, canvas.width, canvas.height);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, haloA.textures[0]);
    gl.uniform1i(compositeProgram.uniforms.uHalo, 3);
    gl.uniform1f(compositeProgram.uniforms.uGlow, settings.glow);
    gl.uniform1f(compositeProgram.uniforms.uGradient, settings.gradientOpacity);
    gl.uniform1f(compositeProgram.uniforms.uGrain, settings.grain);
    gl.uniform1f(compositeProgram.uniforms.uFrame, frameSeed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  };

  const resize = () => {
    view.width = Math.max(1, container.clientWidth);
    view.height = Math.max(1, container.clientHeight);
    const pixelRatioCap = view.height > 2200 ? 1 : view.height > 1400 ? 1.25 : 1.5;
    view.ratio = Math.min(window.devicePixelRatio || 1, pixelRatioCap);
    canvas.width = Math.max(1, Math.round(view.width * view.ratio));
    canvas.height = Math.max(1, Math.round(view.height * view.ratio));
    sizeTarget(fieldTarget, Math.max(1, Math.round(canvas.width / 2)), Math.max(1, Math.round(canvas.height / 2)));
    sizeTarget(haloA, Math.max(1, Math.round(canvas.width / 4)), Math.max(1, Math.round(canvas.height / 4)));
    sizeTarget(haloB, haloA.width, haloA.height);
    draw();
  };

  const updateInput = (delta) => {
    trail.forEach((point) => {
      point.age += delta;
    });
    while (trail.length && trail[trail.length - 1].age > TRAIL_LIFE) trail.pop();
    for (let index = 0; index < MAX_TRAIL; index += 1) {
      const point = trail[index];
      if (!point) {
        trailData[index * 4 + 2] = 0;
        continue;
      }
      const strength = 1 - point.age / TRAIL_LIFE;
      trailData.set([point.x, point.y, strength * strength, 0], index * 4);
    }
    clicks.forEach((click) => {
      click.age += delta;
    });
    while (clicks.length && clicks[clicks.length - 1].age > CLICK_LIFE) clicks.pop();
    for (let index = 0; index < MAX_CLICKS; index += 1) {
      const click = clicks[index];
      if (!click) {
        clickData[index * 4 + 3] = 0;
        continue;
      }
      const ageRatio = click.age / CLICK_LIFE;
      const envelope = Math.min(1, click.age / 0.08) * (1 - ageRatio) ** 2;
      clickData.set([click.x, click.y, click.age, envelope], index * 4);
    }
  };

  const frame = (now) => {
    raf = 0;
    if (!visible || document.hidden) return;
    const delta = last ? Math.min(Math.max((now - last) / 1000, 0.001), 0.05) : 1 / 60;
    last = now;
    if (!reducedMotion) {
      time += delta * 0.5;
      glyphTime += delta;
    }
    if (introClock < 1) introClock = Math.min(1, introClock + delta / INTRO_SECONDS);
    grainClock += delta;
    if (!reducedMotion && grainClock > 1 / 24) {
      grainClock = 0;
      frameSeed = (frameSeed + 1) % 97;
    }
    updateInput(delta);
    draw();
    if (!reducedMotion || introClock < 1 || clicks.length || trail.length) {
      raf = requestAnimationFrame(frame);
    } else {
      last = 0;
    }
  };

  const wake = () => {
    if (!raf && !document.hidden) raf = requestAnimationFrame(frame);
  };

  const locate = (event) => {
    const bounds = container.getBoundingClientRect();
    const x = (event.clientX - bounds.left) / Math.max(1, bounds.width);
    const y = 1 - (event.clientY - bounds.top) / Math.max(1, bounds.height);
    const aspect = bounds.width / Math.max(1, bounds.height);
    pointer.inside = x >= 0 && x <= 1 && y >= 0 && y <= 1;
    pointer.x = (x - 0.5) * aspect;
    pointer.y = y - 0.5;
  };

  window.addEventListener(
    "pointermove",
    (event) => {
      locate(event);
      if (!pointer.inside || reducedMotion) return;
      const head = trail[0];
      const gap = head ? Math.hypot(pointer.x - head.x, pointer.y - head.y) : Infinity;
      if (gap < TRAIL_STEP) return;
      if (head && head.age < 0.1) {
        const steps = Math.min(6, Math.floor(gap / (TRAIL_STEP * 2)));
        for (let index = 1; index <= steps; index += 1) {
          const amount = index / (steps + 1);
          trail.unshift({
            x: head.x + (pointer.x - head.x) * amount,
            y: head.y + (pointer.y - head.y) * amount,
            age: 0,
          });
        }
      }
      trail.unshift({ x: pointer.x, y: pointer.y, age: 0 });
      if (trail.length > MAX_TRAIL) trail.length = MAX_TRAIL;
      wake();
    },
    { passive: true },
  );

  window.addEventListener(
    "pointerdown",
    (event) => {
      locate(event);
      if (!pointer.inside || reducedMotion) return;
      clicks.unshift({ x: pointer.x, y: pointer.y, age: 0 });
      if (clicks.length > MAX_CLICKS) clicks.pop();
      wake();
    },
    { passive: true },
  );

  const intersection = new IntersectionObserver((entries) => {
    visible = entries.some((entry) => entry.isIntersecting);
    if (visible) {
      last = 0;
      wake();
    }
  });
  intersection.observe(container);
  new ResizeObserver(resize).observe(container);
  document.addEventListener("visibilitychange", () => {
    last = 0;
    wake();
  });

  window.asciiBackground = {
    setExpanded(expanded) {
      container.dataset.expanded = String(expanded);
    },
  };

  atlas = buildAtlas();
  if (document.fonts?.load) {
    document.fonts.load(`300 64px ${settings.fontFamily}`, settings.characters).then(() => {
      if (!gl.isContextLost()) {
        if (atlas) gl.deleteTexture(atlas.texture);
        atlas = buildAtlas();
        draw();
      }
    }).catch(() => {});
  }
  resize();
  wake();
})();

    </script>
  </body>
</html>
